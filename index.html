<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Eyewear Try-On</title>
    <!-- Nhúng Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <!-- NHÚNG THƯ VIỆN MEDIAPIPE -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="app-container">
        <!-- Cột trái: Khung Camera -->
        <div class="camera-section">
            <div class="video-wrapper">
                <video id="webcam" autoplay playsinline></video>
                <canvas id="overlay"></canvas>
                <!-- Khung Oval mờ hướng dẫn người dùng đặt mặt vào -->
                <div class="face-guide" id="face-guide"></div>
            </div>
            <p id="camera-status" role="status" aria-live="polite">Đang khởi động camera...</p>
            <button id="btn-scan" class="cta-btn primary">Quét khuôn mặt</button>
            <div class="tryon-controls">
                <button id="btn-remove" class="cta-btn secondary" hidden>Bỏ kính</button>
                <label><input id="show-mesh" type="checkbox"> Hiện lưới mặt</label>
            </div>
            <details id="calibration">
                <summary>Hiệu chỉnh kính (kỹ thuật)</summary>
                <div id="anchor-preview"></div>
                <p id="calibration-name">Chọn mẫu kính để hiệu chỉnh.</p>
                <label>Tinh chỉnh kích thước <input data-adjust="size" type="range" min="0.75" max="1.25" step="0.01" value="1"></label>
                <label>Dịch ngang <input data-adjust="x" type="range" min="-0.15" max="0.15" step="0.005" value="0"></label>
                <label>Dịch dọc <input data-adjust="y" type="range" min="-0.15" max="0.15" step="0.005" value="0"></label>
                <label>Góc bù <input data-adjust="angle" type="range" min="-15" max="15" step="0.5" value="0"></label>
                <div class="tryon-controls">
                    <button id="btn-reset" type="button" class="cta-btn secondary">Khôi phục</button>
                    <button id="btn-export" type="button" class="cta-btn secondary">Xuất cấu hình</button>
                </div>
                <textarea id="calibration-output" readonly aria-label="Cấu hình hiệu chỉnh" hidden></textarea>
                <p>Để lưu lâu dài, chép trường adjustment vào mẫu tương ứng trong tryon-data.js.</p>
            </details>
        </div>

        <!-- Cột phải: Kết quả & Gợi ý (Khu vực E-commerce) -->
        <div class="result-section">
            <h2>Kết quả Phân tích AI</h2>
            <div class="status-box">
                <p>Dáng mặt của bạn:</p>
                <h3 id="face-shape-result">Chưa quét</h3>
            </div>
            
            <div class="recommendation-area">
                <h3>Kính mắt gợi ý cho bạn</h3>
                <div id="product-list" class="product-list">
                    <!-- Các card sản phẩm sẽ được JS đẩy vào đây -->
                    <p style="color: gray; text-align: center;">Vui lòng đưa mặt vào khung và bấm Quét</p>
                </div>
            </div>
        </div>
    </div>
    
    <!-- NHÚNG CÁC FILE JS -->
    <script src="data.js"></script>
    <script src="model.js"></script>
    <script src="tryon-data.js"></script>
    <script src="tryon-geometry.js"></script>
    <script src="app.js"></script>
</body>
</html>
